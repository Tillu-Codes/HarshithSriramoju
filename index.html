<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<meta name="description" content="">

<link rel="stylesheet" href="css/styles.css">

<!-- Hero asset: start it downloading now instead of after settings.js,
     content.js and app.js have all parsed. `type` lets the browser reject
     the preload if module 1 is ever swapped back to a still image, and
     tools/check.js asserts href + as + type all match module 1's src in
     content.js, so this cannot silently drift out of sync. -->
<link rel="preload" as="video" type="video/mp4" href="assets/pics&gifs/new1.mp4" fetchpriority="high">
</head>

<body>

<!-- ====================== PROJECT MODULE STREAM ==================== -->
<main class="stream" id="stream">
  <div class="stream__inner" id="modules"><!-- built by js/app.js --></div>
</main>

<!-- ============================ LIGHTBOX =========================== -->
<div class="lb" id="lightbox" hidden>
  <button class="lb__close" id="lbClose" type="button" aria-label="Close">&times;</button>
  <button class="lb__nav lb__nav--prev" id="lbPrev" type="button" aria-label="Previous">&#8249;</button>
  <button class="lb__nav lb__nav--next" id="lbNext" type="button" aria-label="Next">&#8250;</button>
  <figure class="lb__stage"><img id="lbImg" alt=""><video id="lbVid" class="lb__video" playsinline loop muted hidden></video></figure>
</div>

<!-- ======================== BACK TO TOP ============================ -->
<button class="totop" id="toTop" type="button" aria-label="Back to top">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l7 7-1.4 1.4L13 8.8V20h-2V8.8l-4.6 4.6L5 12z"/></svg>
</button>

<script src="settings.js"></script>
<script src="content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
