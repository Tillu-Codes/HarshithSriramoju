<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>about slide preview</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<main class="stream" id="stream">
  <div class="stream__inner" id="modules"></div>
</main>

<div class="lb" id="lightbox" hidden>
  <button class="lb__close" id="lbClose" type="button" aria-label="Close">&times;</button>
  <button class="lb__nav lb__nav--prev" id="lbPrev" type="button" aria-label="Previous">&#8249;</button>
  <button class="lb__nav lb__nav--next" id="lbNext" type="button" aria-label="Next">&#8250;</button>
  <figure class="lb__stage"><img id="lbImg" alt=""></figure>
</div>

<button class="totop" id="toTop" type="button" aria-label="Back to top">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l7 7-1.4 1.4L13 8.8V20h-2V8.8l-4.6 4.6L5 12z"/></svg>
</button>

<script src="settings.js"></script>
<script src="content.js"></script>
<script>
  /* render ONE module on its own at full canvas size.
     pick it with the hash: preview.html#videogrid  |  #about  |  #8   */
  var want = (location.hash || '#videogrid').slice(1).toLowerCase();
  var mod = CONTENT.modules.filter(function (m) {
    return m.type === want || String(m.n) === want;
  })[0] || CONTENT.modules.filter(function (m) { return m.type === 'videogrid'; })[0];
  SETTINGS.reveal.enabled = false;
  CONTENT.modules = [mod];
  document.title = 'preview: ' + (mod ? mod.type + ' / n=' + mod.n : 'none');
</script>
<script src="js/app.js"></script>
</body>
</html>
